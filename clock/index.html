<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi Timezone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 50px rgba(0,0,0,0.3); max-width: 1000px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .format-selector { padding: 10px 15px; border: 2px solid #667eea; border-radius: 5px; cursor: pointer; }
        .clock-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 30px 0; }
        .timezone-block { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 10px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .timezone-label { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; }
        .timezone-time { font-size: 2.5em; font-weight: bold; font-family: 'Courier New', monospace; margin: 15px 0; }
        .timezone-date { font-size: 0.95em; opacity: 0.85; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        table th { background-color: #333; color: white; padding: 15px; text-align: left; }
        table td { border: 1px solid #ddd; padding: 12px 15px; }
        table tr:hover { background-color: #f5f5f5; }
        .info { background-color: #e7f3ff; border-left: 4px solid #2196F3; padding: 15px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ Digital Clock</h1>
        <p class="subtitle">Real-time display across multiple timezones</p>
        <div class="controls">
            <select class="format-selector" id="formatSelector" onchange="changeFormat()">
                <option value="24">24-Hour Format</option>
                <option value="12">12-Hour Format</option>
            </select>
        </div>
        <div id="clockContainer"></div>
        <h2 style="margin-top: 40px;">Table View</h2>
        <div id="tableContainer"></div>
        <div class="info">
            <strong>Info:</strong> The clock updates every second with times in IST, UTC, EST, PST, GST, and SGT.
        </div>
    </div>
    <script src="clock.js"></script>
    <script>
        const clock = new DigitalClock({ format: '24', updateInterval: 1000 });
        clock.displayInContainer('clockContainer');
        clock.displayAsTable('tableContainer');
        function changeFormat() {
            const format = document.getElementById('formatSelector').value;
            clock.setFormat(format);
        }
    </script>
</body>
</html>
