<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddhivinayak Digital - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }
        
        /* Header with Navigation */
        .header { background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%); color: white; padding: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        
        .header-content { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header h1 { font-size: 1.6em; font-weight: 600; }
        .user-info { font-size: 0.95em; opacity: 0.95; }
        
        .header-right { display: flex; gap: 10px; align-items: center; }
        
        .nav-btn { padding: 10px 20px; background-color: rgba(255,255,255,0.2); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95em; font-weight: 600; transition: background-color 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .nav-btn:hover { background-color: rgba(255,255,255,0.3); }
        .nav-btn.logout { background-color: #ff4444; }
        .nav-btn.logout:hover { background-color: #cc0000; }
        
        /* Main Container */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* Two Column Layout */
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        
        /* Clock Section */
        .clock-section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .clock-section h2 { color: #333; margin-bottom: 20px; font-size: 1.5em; text-align: center; }
        
        .clock-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .timezone-block { background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .timezone-label { font-size: 0.9em; font-weight: bold; opacity: 0.9; }
        .timezone-time { font-size: 1.8em; font-weight: bold; font-family: 'Courier New', monospace; margin: 8px 0; }
        .timezone-date { font-size: 0.8em; opacity: 0.8; }
        
        /* Form Section */
        .form-section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-section h2 { color: #333; margin-bottom: 8px; font-size: 1.5em; text-align: center; }
        .form-section .subtitle { text-align: center; color: #0066ff; margin-bottom: 25px; font-weight: 500; }
        
        /* Form Styles */
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 6px; font-size: 0.95em; }
        label .required { color: #ff4444; }
        
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; font-family: inherit; transition: border-color 0.3s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1); }
        
        textarea { resize: vertical; min-height: 80px; }
        
        /* Amount Row */
        .amount-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Pending Amount (Read-only) */
        .pending-amount { background-color: #f5f5f5; }
        
        /* Submit Button */
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%); color: white; border: none; border-radius: 6px; font-size: 1.05em; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3); }
        .submit-btn:active { transform: translateY(0); }
        
        /* Order List Section */
        .order-list-section { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-top: 30px; }
        .order-list-section h2 { color: #333; margin-bottom: 20px; font-size: 1.5em; }
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; }
        table th { background-color: #0066ff; color: white; padding: 12px; text-align: left; font-weight: 600; }
        table td { border-bottom: 1px solid #eee; padding: 12px; }
        table tr:hover { background-color: #f9f9f9; }
        
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: 600; }
        .status-new { background-color: #e3f2fd; color: #1976d2; }
        .status-pending { background-color: #fff3e0; color: #f57c00; }
        .status-progress { background-color: #f3e5f5; color: #7b1fa2; }
        .status-completed { background-color: #e8f5e9; color: #388e3c; }
        
        .payment-badge { font-size: 0.85em; }
        .payment-unpaid { color: #d32f2f; }
        .payment-partial { color: #f57c00; }
        .payment-paid { color: #388e3c; }
        
        /* Summary Stats */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.9em; opacity: 0.9; }
        .stat-value { font-size: 2em; font-weight: bold; margin-top: 8px; }
        
        /* Message */
        .message { padding: 15px; margin-bottom: 20px; border-radius: 6px; display: none; }
        .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.show { display: block; }
        
        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .clock-container { grid-template-columns: 1fr; }
            .amount-row { grid-template-columns: 1fr; }
            .header-content { flex-wrap: wrap; gap: 10px; }
            .header-right { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- Header with Navigation -->
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <h1>🙏 Siddhivinayak Digital</h1>
                <div class="user-info">👤 <span id="userDisplay">User</span></div>
            </div>
            <div class="header-right">
                <a href="dashboard.html" class="nav-btn">🏠 Home</a>
                <button onclick="logout()" class="nav-btn logout">🚪 Logout</button>
            </div>
        </div>
    </div>
    
    <!-- Main Container -->
    <div class="container">
        <!-- Two Column Layout -->
        <div class="main-layout">
            <!-- Clock Section -->
            <div class="clock-section">
                <h2>⏰ Live Clock</h2>
                <div id="clockContainer"></div>
            </div>
            
            <!-- Form Section -->
            <div class="form-section">
                <h2>Create New Order</h2>
                <p class="subtitle">OM Namah Shivay</p>
                
                <div id="message" class="message"></div>
                
                <form id="orderForm">
                    <!-- Customer Name -->
                    <div class="form-group">
                        <label>Customer Name <span class="required">*</span></label>
                        <input type="text" id="customerName" name="customerName" required placeholder="Enter customer name">
                    </div>
                    
                    <!-- Customer Contact -->
                    <div class="form-group">
                        <label>Customer Contact</label>
                        <input type="tel" id="customerContact" name="customerContact" placeholder="Enter phone number">
                    </div>
                    
                    <!-- Job Description -->
                    <div class="form-group">
                        <label>Job Description <span class="required">*</span></label>
                        <textarea id="jobDescription" name="jobDescription" required placeholder="Enter job description"></textarea>
                    </div>
                    
                    <!-- Total Amount -->
                    <div class="form-group">
                        <label>Total Amount</label>
                        <input type="number" id="totalAmount" name="totalAmount" placeholder="0" min="0" oninput="calculatePending()">
                    </div>
                    
                    <!-- Advance Amount -->
                    <div class="form-group">
                        <label>Advance Amount</label>
                        <input type="number" id="advanceAmount" name="advanceAmount" placeholder="0" min="0" oninput="calculatePending()">
                    </div>
                    
                    <!-- Pending Amount (Read-only) -->
                    <div class="form-group">
                        <label>Pending Amount</label>
                        <input type="number" id="pendingAmount" name="pendingAmount" class="pending-amount" readonly placeholder="0">
                    </div>
                    
                    <!-- Order Date -->
                    <div class="form-group">
                        <label>Order Date</label>
                        <input type="date" id="orderDate" name="orderDate">
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Submit Order</button>
                </form>
            </div>
        </div>
        
        <!-- Order List Section -->
        <div class="order-list-section">
            <h2>📋 All Orders</h2>
            
            <!-- Stats -->
            <div class="stats-row" id="statsRow"></div>
            
            <!-- Table -->
            <div style="overflow-x: auto;">
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer Name</th>
                            <th>Contact</th>
                            <th>Job Description</th>
                            <th>Total Amount</th>
                            <th>Advance</th>
                            <th>Pending</th>
                            <th>Order Date</th>
                            <th>Status</th>
                            <th>Payment</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="clock/clock.js"></script>
    <script>
        // Check authentication
        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'login.html';
            }
        }
        
        // Display current user
        function displayUser() {
            const user = localStorage.getItem('currentUser') || 'User';
            document.getElementById('userDisplay').textContent = user;
        }
        
        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('loggedIn');
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            }
        }
        
        // Initialize
        checkAuth();
        displayUser();
        
        // Initialize date to today
        document.getElementById('orderDate').valueAsDate = new Date();
        
        // Initialize Clock
        const clock = new DigitalClock({ format: '24', updateInterval: 1000 });
        clock.displayInContainer('clockContainer');
        
        // Load orders from localStorage
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            return orders;
        }
        
        // Save orders to localStorage
        function saveOrders(orders) {
            localStorage.setItem('orders', JSON.stringify(orders));
        }
        
        // Calculate Pending Amount
        function calculatePending() {
            const total = parseFloat(document.getElementById('totalAmount').value) || 0;
            const advance = parseFloat(document.getElementById('advanceAmount').value) || 0;
            const pending = total - advance;
            document.getElementById('pendingAmount').value = pending.toFixed(2);
        }
        
        // Display Orders Table
        function displayOrders() {
            const orders = loadOrders();
            const tbody = document.getElementById('ordersBody');
            const statsRow = document.getElementById('statsRow');
            
            tbody.innerHTML = '';
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 20px;">No orders yet. Create your first order above!</td></tr>';
                statsRow.innerHTML = '';
                return;
            }
            
            // Calculate stats
            let totalRevenue = 0;
            let totalAdvance = 0;
            let totalPending = 0;
            
            orders.forEach(order => {
                totalRevenue += order.totalAmount;
                totalAdvance += order.advanceAmount;
                totalPending += order.pendingAmount;
            });
            
            // Display stats
            statsRow.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value">${orders.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value">₹${totalRevenue.toFixed(0)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Advance</div>
                    <div class="stat-value">₹${totalAdvance.toFixed(0)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Pending</div>
                    <div class="stat-value">₹${totalPending.toFixed(0)}</div>
                </div>
            `;
            
            // Display orders
            orders.forEach(order => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.customerName}</td>
                    <td>${order.customerContact}</td>
                    <td>${order.jobDescription}</td>
                    <td>₹${order.totalAmount}</td>
                    <td>₹${order.advanceAmount}</td>
                    <td>₹${order.pendingAmount}</td>
                    <td>${order.orderDate}</td>
                    <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                    <td><span class="payment-badge payment-${order.paymentStatus}">${order.paymentStatus}</span></td>
                `;
            });
        }
        
        // Handle Form Submit
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const orders = loadOrders();
            const newId = orders.length > 0 ? Math.max(...orders.map(o => o.id)) + 1 : 1;
            
            const newOrder = {
                id: newId,
                customerName: document.getElementById('customerName').value,
                customerContact: document.getElementById('customerContact').value,
                jobDescription: document.getElementById('jobDescription').value,
                totalAmount: parseFloat(document.getElementById('totalAmount').value) || 0,
                advanceAmount: parseFloat(document.getElementById('advanceAmount').value) || 0,
                pendingAmount: parseFloat(document.getElementById('pendingAmount').value) || 0,
                orderDate: document.getElementById('orderDate').value,
                status: 'new',
                paymentStatus: parseFloat(document.getElementById('advanceAmount').value) > 0 ? 'partial' : 'unpaid'
            };
            
            orders.push(newOrder);
            saveOrders(orders);
            
            // Show success message
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = `✓ Order #${newId} created successfully!`;
            messageDiv.className = 'message success show';
            setTimeout(() => messageDiv.classList.remove('show'), 3000);
            
            // Reset form
            document.getElementById('orderForm').reset();
            document.getElementById('orderDate').valueAsDate = new Date();
            document.getElementById('pendingAmount').value = '0';
            
            // Refresh display
            displayOrders();
        });
        
        // Initial display
        displayOrders();
    </script>
</body>
</html>
